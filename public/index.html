<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Screen 1: pick a name and a room -->
  <div id="login-screen" class="screen">
    <div class="login-card">
      <h1>Campus Chat</h1>
      <label for="username-input">Your name</label>
      <input id="username-input" type="text" maxlength="24" placeholder="e.g. Alex" autocomplete="off">

      <label for="room-input">Room</label>
      <input id="room-input" type="text" maxlength="40" placeholder="e.g. general" autocomplete="off">
      <div id="room-suggestions" class="room-suggestions"></div>

      <button id="join-btn">Join chat</button>
      <p id="login-error" class="error"></p>
    </div>
  </div>

  <!-- Screen 2: the actual chat -->
  <div id="chat-screen" class="screen hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2 id="room-title">#room</h2>
        <button id="leave-btn" title="Leave room">Leave</button>
      </div>
      <h3>Online (<span id="user-count">0</span>)</h3>
      <ul id="user-list"></ul>
    </aside>

    <main class="chat-main">
      <div id="messages" class="messages"></div>
      <div id="typing-indicator" class="typing-indicator"></div>
      <form id="message-form" class="message-form">
        <input id="message-input" type="text" placeholder="Type a message…" autocomplete="off" maxlength="2000">
        <button type="submit">Send</button>
      </form>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
